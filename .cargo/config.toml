[target.apex_p]
runner = "speculos -m apex_p"
rustflags = ['--cfg=ledger_device="apex_p"']

# The `ledger_device` cfg for builds on the custom target specs that do not go
# through `cargo ledger`, such as `cargo clippy --target <device>`. Builds with
# `cargo ledger` use the built-in triples (see `builtin_target` in Cargo.toml),
# which these sections do not match.
[target.nanox]
rustflags = ['--cfg=ledger_device="nanox"']

[target.nanosplus]
rustflags = ['--cfg=ledger_device="nanosplus"']

[target.stax]
rustflags = ['--cfg=ledger_device="stax"']

[target.flex]
rustflags = ['--cfg=ledger_device="flex"']

[build]
target = "apex_p"

[profile.release]
opt-level = 'z'
lto = true

# Uncomment the line below to generate a map file
# rustflags = ["-Clink-args=-Map=app.map"]

[unstable]
build-std = ["core", "alloc"]
build-std-features = ["compiler-builtins-mem"]

# By default, heap size is enforced to 8192 bytes.
# Authorized values are [2048, 4096, 8192, 16384, 24576]
# Uncomment the following lines to set the heap size to 4096 bytes for instance
#[env]
#HEAP_SIZE = "4096"