name: GitHub release
on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'

jobs:
  github-release:
    name: GitHub release using the reusable workflow
    # Must cover every permission reusable_app_release.yml declares, including its job-level ones.
    permissions:
      contents: write       # Needed to create the GitHub release
      actions: write        # Needed for upload-artifact
      pull-requests: write  # Needed for the nested reusable_build.yml call
      packages: read        # Needed to pull the app-builder image
    uses: LedgerHQ/ledger-app-workflows/.github/workflows/reusable_app_release.yml@v1
    if: startsWith(github.ref, 'refs/tags/')
    with:
      app_ref_name: ${{ github.ref_name }}
      builder: 'ledger-app-builder'

  sideload-installer:
    name: Attach the sideload installers to the release
    needs: github-release
    uses: ./.github/workflows/sideload_installer.yml
    permissions:
      contents: write
      actions: write
      id-token: write
      attestations: write
      # Checked statically for the nested reusable_build.yml call, even though it is skipped here.
      pull-requests: write
      packages: read  # Needed to pull the app-builder image
    with:
      # Package the exact binaries published by github-release rather than rebuilding them.
      binaries_artifact: app_binaries
      release_tag: ${{ github.ref_name }}
